kind: Added
body: '`trellis doctor --format json|github` gives the one command documented as "run it on every PR" a machine-readable form. Every finding is now a typed record — `{check, severity, message, file, package, fixable}` — so CI can group findings by package, filter to the ones `--fix` would clear, or render them into a PR comment, instead of parsing prose written for a terminal. `--format github` emits the same findings as GitHub Actions workflow commands, so they annotate the offending file in a PR''s Files tab rather than scrolling past in a log. The `check` values are a documented enum on the [JSON output contract](https://trellis.tylerbutler.com/docs/json-output/) page; `message` prose is explicitly not contractual. Text output is unchanged.'
