kind: Added
body: 'Changelog entries can carry a second grouping axis. `categories` under `[tools.trellis.changelog]` is a vocabulary like `kinds` but with no bump attached, and a fragment naming one is rendered under a category heading *above* the kind headings — so a package made of several distinct parts, such as the subcommands of a CLI, gets a section per part instead of one flat list per version. Kinds already answer "how big is this change", which is the axis a version bump needs; nothing answered "which part changed", and overloading kinds with scopes would have entangled grouping with version derivation. Categories carry no bump, so they group without touching it. Write one with `trellis changelog new --category <name>`, which records a `category` key in the fragment. The axis is opt-in and empty by default: with no `categories` configured, rendered output is byte-for-byte what it was before, and the category stays optional on each fragment even once configured — entries naming none, including the generated dependency entries, trail the named categories under `uncategorized_label` (`Other` by default). An unknown category is an invalid fragment, exactly as an unknown kind is: `doctor` reports it with the offending file and `version` refuses, rather than rendering the entry nowhere. While the axis is on, kind headings drop from `###` to `####` to sit under the categories, unless `kind_format` is set explicitly — trellis never rewrites a template you wrote down. Note that fragments are strict about unknown keys, so one carrying a `category` will not parse under a trellis older than this release. See [categories](https://trellis.tylerbutler.com/docs/configuration/#categories).'
