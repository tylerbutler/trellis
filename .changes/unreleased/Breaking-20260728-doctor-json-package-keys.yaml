kind: Breaking
body: '`trellis.doctor/1` renames two identifiers to match the package/member rule: the workspace-size field `members` becomes `packages`, and the `member_manifest` check value becomes `package_manifest`. A consumer doing `jq ".members"` becomes `jq ".packages"`, and a workflow branching on `check == "member_manifest"` must match `"package_manifest"`. `member_glob` keeps its name — it genuinely reports on the `members` globs — as do `configless` and `auto_members`, which describe how membership was determined rather than the packages themselves. This lands without a major bump because `schema` identifiers ship for the first time in this release: nothing has ever consumed `trellis.doctor/1` under a stability promise, so renaming now costs a search-and-replace for anyone tracking git, and after this release it would cost a major.'
