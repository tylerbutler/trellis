kind: Changed
body: 'Trellis now exits `3` when it could not run at all, distinguishing that from the `1` it returns when a command ran correctly and found problems. Previously both collapsed to `1`, so a workflow could not tell a workspace with `doctor` findings from an unparseable config, a missing `gleam`/`gh`, a directory that is not a git repository, or Hex being unreachable after retries — a distinction that matters in exactly the place trellis is built for, where a CI step should fail the build on findings but be reported differently when the tool never got off the ground. The full contract is `0` success, `1` findings, `2` usage (clap''s own), `3` internal or environment error, and it is now covered by tests rather than left incidental. A failed task still exits `1` and does not propagate the child''s exit code, since a child exiting `2` or `3` would otherwise masquerade as a usage or internal error. See [Compatibility](https://trellis.tylerbutler.com/docs/compatibility/), a new page that also records what semver covers at 1.0 — the CLI surface, configuration keys, exit codes, and the JSON payloads, but not human-readable output or anything in `src/` — and declares an MSRV of 1.85.'
