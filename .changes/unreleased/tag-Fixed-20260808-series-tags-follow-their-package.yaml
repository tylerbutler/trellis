component: tag
kind: Fixed
body: '**A package''s series tag no longer follows commits that did not release it.** `tag create` decided a series tag needed moving by asking whether it pointed at `HEAD`, so in a monorepo every series tag chased every commit: releasing one package force-moved and force-pushed the series tags of every other package onto a commit that did not touch them, and a docs-only commit moved all of them. The release signal is now the package''s manifest version stored at the tag — the rule the repository tag has always used — so a series tag moves when, and only when, its own package releases a new version in that series. A commit that releases nothing is reported as `every releasable package version is already tagged` instead of a run of `moved`/`force-pushed` lines. A manifest that cannot be read at the tag (a package that has since moved, or a tag predating it) still moves the tag, as before. This matters more when `package_tags` lists more than one series level, where the stale moves came in pairs.'
time: 2026-08-08T00:02:00.000000-07:00
