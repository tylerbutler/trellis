kind: Added
body: '`trellis init` bootstraps a workspace. `trellis new` scaffolded a member, but nothing scaffolded the workspace itself, so adopting trellis in an existing repo meant hand-writing the `[tools.trellis]` table from the reference page — and configless mode only softened that until the first option was needed. `init` writes the table into the repository root''s `gleam.toml`, creating a config-only manifest if the root is not itself a package and preserving formatting, comments, and any other `[tools.*]` table if it is. What it writes is almost empty: the table''s presence is what marks the workspace root, and members stay auto-discovered, so `members` is derivable and is not declared. In its place are comments pointing at what can be configured. It reports the members it discovered so they can be checked, refuses to run if the repository is already a trellis workspace or if a member manifest carries the table, and finishes by running `doctor`.'
