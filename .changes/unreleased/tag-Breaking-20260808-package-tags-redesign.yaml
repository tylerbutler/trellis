component: tag
kind: Breaking
body: |-
  **Tag configuration is one list per scope, and four keys are removed.** `publish.package_tags` now names the tags a release maintains for each package, one entry per tag, each naming how much of the version it keeps: `exact` keeps the whole thing (`lat_cli-v1.2.3`) and is immutable, `major` (`lat_cli-v1`) and `minor` (`lat_cli-v1.2`) truncate it and move. This replaces the old two-axis shape, where `tag_mode` gated whether `series_tag_format` was used at all — a combination like `tag_mode = "exact"` with series settings alongside it was accepted and silently did nothing. It also makes a plain `v0` reachable: the previous derivation special-cased 0.x to `major.minor`, so the packages most likely to want a bare major tag were the ones that could not have one.

    ```toml
    # before                                  # after
    tag_format = "{name}-v{version}"          exact_tag_format = "{name}-v{version}"
    tag_mode = "exact"                        package_tags = ["exact"]
    tag_mode = "series"                       package_tags = ["minor"]
    tag_mode = "both"                         package_tags = ["exact", "minor"]
    tag_mode_overrides = {                    package_tags_overrides = {
      both = ["packages/cli"] }                 "packages/cli" = ["exact", "minor"] }

    [publish.repository_series]               repository_tag_package = "cli"
    package = "cli"                           repository_tag_format = "v{series}"
    format  = "v{series}"                     repository_tags = ["minor"]   # now required
    ```

    Each removed key is a **load-time error naming its replacement**, not an ignored unknown key: trellis is lenient about unrecognized keys so a workspace stays readable by an older binary, but leniency is wrong for these — silently dropping a custom `tag_format` or a `tag_mode` falls back to a default that writes *different tags*, and a series tag that quietly stops moving is not something to discover after the release.

    Two behavior changes come with the shape. A 1.x package that moved `{name}-v1` now moves `{name}-v1.2` under `package_tags = ["minor"]`; list `major` instead, or as well, to keep the one-part tag. And the repository tag's settings are now flat keys in `[tools.trellis.publish]`, which removes a real trap: the old sub-table and the workspace table both accepted a series-tag list, so a list written after the sub-table header bound to the repository tag rather than the workspace, with no error and no warning. The repository tag is opt-in and stays explicit: `repository_tag_package`, `repository_tag_format`, and a non-empty `repository_tags` are required together, and a partly-written trio is an error naming the keys that are missing. Its levels are stated rather than inferred from `package_tags`, so a list written for packages never decides what the repository publishes.

    Unchanged: the default is still exact tags only, so a workspace that configured no tag keys behaves identically. Exact and series tags keep their separate lifecycles — immutable-with-divergence-preflight versus force-move — the `trellis.tag_plan` payload is unchanged (`kind` still reports `exact`, `series`, and `repository_series`), and `ci outputs` still emits `tags=` and `series_tags=` with no new key.
