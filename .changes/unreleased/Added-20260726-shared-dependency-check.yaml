kind: Added
body: '`trellis doctor` now checks that members agree on the external dependencies they share. Nothing previously noticed that `packages/lat_core` required `gleam_stdlib >= 0.44.0` while `packages/lat_cli` required `>= 0.60.0` — this is what people install syncpack for in other ecosystems, and trellis already had every input in the workspace model. Requirements are compared as written rather than parsed as ranges, since trellis stores them verbatim and the check is that duplicated strings are identical; `>= 1.0` and `>=1.0` therefore read as divergent, which the message says out loud. Path dependencies are out of scope, carrying no requirement to agree on. Divergence is sometimes deliberate, so it is a warning by default and does not fail CI; the new `[tools.trellis.doctor] shared_dependencies` key takes `warn`, `error`, or `off`. There is no `doctor --fix` for it, because unifying to the highest requirement is a judgment call rather than a mechanical remedy.'
