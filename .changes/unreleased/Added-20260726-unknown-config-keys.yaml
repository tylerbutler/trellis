kind: Added
body: 'Keys under `[tools.trellis]` that trellis does not recognize are now reported instead of ignored. A key nothing claims is silently ignored drift — the workspace keeps using the default and produces the wrong tags with no signal at all, which is precisely what the tool exists to catch. `doctor` reports each one as a warning rather than an error: an unrecognized key may belong to a newer trellis, and erroring would make a workspace unloadable under a pinned older one, which is a bad failure for a tool that CI pins. The free-form tables — `exclude`, `tasks`, and `publish.tag_mode_overrides` — take keys you choose, hyphens and all, and are never reported. Detection compares against what the config structs actually accept rather than a hand-maintained list of key names, so it cannot drift as keys are added.'
