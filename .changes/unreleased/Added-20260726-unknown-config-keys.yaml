kind: Added
body: 'Keys under `[tools.trellis]` that trellis does not recognize are now reported instead of ignored. Every config key is kebab-case, so `tag_format = "..."` under `[tools.trellis.publish]` was a plausible typo that silently did nothing — the workspace kept using the default `{name}-v{version}` and produced the wrong tags with no signal at all, which is precisely the drift the tool exists to catch. A key whose kebab-cased form is a real one is an error naming what you meant, and it fails every command rather than only `doctor`. Anything else is a `doctor` warning: it may belong to a newer trellis, and erroring would make a workspace unloadable under a pinned older one, which is a bad failure for a tool that CI pins. The free-form tables — `exclude`, `tasks`, and `publish.tag-mode-overrides` — take keys you choose, underscores and all, and are never reported. Detection compares against what the config structs actually accept rather than a hand-maintained list of key names, so it cannot drift as keys are added.'
