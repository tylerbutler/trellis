kind: Added
body: '`trellis run` and `trellis exec` accept `--json`, emitting the new `trellis.run/1` and `trellis.exec/1` payloads: one record per package carrying its path, status, wall-clock duration, and — when it failed — the exit code and the command that produced it. This is what makes "only test what a PR touched" reportable as well as doable; previously the only machine-readable signal was the overall exit code, and recording per-package results meant parsing a stream explicitly written for a person that changes shape between a terminal and a pipe. Because a job runs several commands when a custom task sets `needs-deps`, `exit-code` and `command` describe the one that failed rather than the whole job, and a package that never ran because scheduling stopped at an earlier failure reports `skipped` — which is not a pass and still fails the command. Under `--json` the per-package stream moves to stderr so a long run stays observable while stdout carries nothing but the payload, and the progress rows and summary table are suppressed. See the [JSON output contract](https://trellis.tylerbutler.com/docs/json-output/).'
