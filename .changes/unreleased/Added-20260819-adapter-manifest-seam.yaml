component: trellis
kind: Added
body: |-
  **`[tools.trellis.adapter]` supports packages with non-Gleam manifests.** The required `manifest` key names the manifest relative to each package directory. Its extension selects TOML, JSON, or YAML parsing. The optional `name` and `version` keys are dotted field paths, defaulting to `name` and `version`. Omit `members` to auto-discover packages, including a package at the workspace root. JSON manifests must be valid JSON with string name and version fields.

    Adapter workspaces can keep `[tools.trellis]` in **`trellis.toml`** at the workspace root. The native Gleam backend requires configuration in `gleam.toml`; `doctor` and normal commands reject a `trellis.toml` configuration without an adapter. Move the table and its subtables into `gleam.toml`, creating a config-only file if needed. Configless Gleam workspaces still work, and unrelated Gleam manifests do not prevent adapter use. Carrying the table in both root files is an error.

    The dependency graph is flat under an adapter — no dependency edges are declared, so topological order is member order and a workspace dependency never ripple-bumps. `publish.lifecycle` defaults to `git_only` and `hex` anywhere under an adapter is a configuration error, because there is no registry to publish to.
