component: tag
kind: Changed
body: '**A `{name}`-less `series_tag_format` is deprecated and will be removed at 1.0.** Dropping `{name}` was the way to get one repository-wide moving tag before the `repository_tag_*` keys existed, but it is a *package* template with the discriminator taken out: every package''s series tag then matches every member, so `trellis ci tag-package` cannot resolve such a tag to a package, and adding a second series-mode package turns a working configuration ambiguous without editing the format. `doctor` now warns on the shape itself rather than waiting for a second package to make it ambiguous, so a single-package repository using it is told before it grows — the finding moves from `tag_collision` to `workspace_config`, and names the replacement. To migrate, restore `{name}` in `series_tag_format` and set `repository_tag_package` and `repository_tag_format`. One difference is deliberate: the repository tag is repository metadata and does not resolve through `ci tag-package` or `publish --tag`, so a repository that routed CI on its `{name}`-less tag should keep a `{name}`-ful package series tag for that and use the repository tag only for git path-dep consumers. Nothing stops releasing in the meantime; the warning is advisory and the tag still moves.'
time: 2026-08-08T00:01:00.000000-07:00
