[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Build only the required packages, and individually
precise-builds = true
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Extra files to place at the root of every archive. `assets/man` is generated
# from the CLI definition (`just docs`) and committed, so it exists in any
# checkout. Note neither the shell installer nor the Homebrew formula installs
# non-binary files — this is for people who unpack the tarball directly and for
# downstream packagers.
include = ["assets/man"]
# Whether to enable GitHub Attestations
github-attestations = true
# Where to host releases
hosting = "github"
# A GitHub repo to push Homebrew formulas to
tap = "tylerbutler/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["./publish-homebrew-tap"]
