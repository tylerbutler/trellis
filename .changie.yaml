changesDir: .changes
unreleasedDir: unreleased
headerPath: header.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
componentFormat: '### {{.Component}}'
kindFormat: '#### {{.Kind}}'
changeFormat: '- {{.Body}}'
body:
    block: true
    minLength: 1
# The subcommand a change belongs to, rendered as a `###` heading above the
# `####` kind headings. Subcommands follow the order `trellis --help` lists them.
#
# `trellis` is the catch-all for changes that aren't scoped to one subcommand —
# the exit-code contract, the global flags, a rule that holds for every `--json`
# payload. It sorts first so a reader meets the binary-wide news before the
# per-command detail.
#
# Every fragment needs a component: changie renders one without under an empty
# `### ` heading. It does not validate the value either, so a typo quietly
# invents a section rather than failing the batch.
components:
    - trellis
    - list
    - graph
    - info
    - run
    - exec
    - changelog
    - version
    - init
    - new
    - release
    - tag
    - publish
    - lockfile
    - pin
    - doctor
    - ci
    - completions
kinds:
    - label: Breaking
      auto: minor
    - label: Added
      auto: minor
    - label: Fixed
      auto: patch
    - label: Performance
      auto: patch
    - label: Changed
      auto: patch
    - label: Reverted
      auto: patch
    - label: Dependencies
      auto: patch
    - label: Security
      auto: patch
newlines:
    afterChangelogHeader: 1
    afterChangelogVersion: 1
    afterComponent: 0
    afterKind: 0
    afterVersion: 1
    beforeChange: 1
    beforeComponent: 1
    beforeKind: 1
    endOfVersion: 1
