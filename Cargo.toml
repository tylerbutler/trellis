[package]
name = "trellis-gleam"
version = "0.11.2"
edition = "2024"
# MSRV: the floor edition 2024 implies. Declared so a `cargo install` on an
# older toolchain reports the version it needs rather than failing mid-build.
rust-version = "1.85"
description = "A workspace CLI for Gleam monorepos: task fan-out, introspection, and release orchestration derived entirely from gleam.toml"
license = "MIT"
homepage = "https://github.com/tylerbutler/trellis"
repository = "https://github.com/tylerbutler/trellis"

# The crates.io name `trellis` is taken by an unrelated 2016 crate (see
# docs/DESIGN.md §11), so the crate publishes as `trellis-gleam`. The `[[bin]]`
# below keeps the installed binary named `trellis`.
[[bin]]
name = "trellis"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "string"] }
# `unstable-dynamic` (the `env`/`engine` modules powering runtime completion) is
# semver-exempt: a patch release inside 4.6.x may break the API. The committed
# Cargo.lock plus clippy `-D warnings` in CI is the guard — breakage surfaces as
# a red dependency-bump PR, not in a user's shell. Floored at 4.6.7 for the
# PowerShell `pwsh` detection fix, which the windows-msvc target needs.
clap_complete = { version = "4.6.7", features = ["unstable-dynamic"] }
clap-markdown = "0.1.5"
clap_mangen = "0.3.0"
glob = "0.3.3"
globset = "0.4.18"
ignore = "0.4.31"
indicatif = { version = "0.18.6", default-features = false, features = ["unicode-width"] }
minijinja = "2.21.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Pure-Rust rustls (via the ureq we already depend on) instead of the default
# native-tls, so release binaries stay OpenSSL-free per the zero-runtime-deps promise.
tiny-update-check = { version = "1.1.3", default-features = false, features = ["rustls", "do-not-track"] }
toml = "1.1.2"
toml_edit = "0.25.12"
ureq = { version = "3.3.0", features = ["json"] }
serde_ignored = "0.1.14"
saphyr-parser = "0.0.12"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.48.0", features = ["json", "redactions"] }
predicates = "3.1.4"
tempfile = "3.27.0"

[build-dependencies]
vergen-gitcl = "9.1.0"
