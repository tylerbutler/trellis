name: Release-plz

# When the changie-release PR merges (bumping Cargo.toml), release-plz
# notices the untagged version, creates the `v{version}` tag (which triggers
# the dist-generated release.yml), and publishes the `trellis-gleam` crate to
# crates.io (the `trellis` name itself is taken).

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ${{ vars.RUNS_ON_RELEASE_PLZ || vars.RUNS_ON || 'ubuntu-latest' }}
    concurrency:
      group: release-plz-release
      cancel-in-progress: false

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ratchet:dtolnay/rust-toolchain@stable

      - name: Run release-plz release
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # ratchet:release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
