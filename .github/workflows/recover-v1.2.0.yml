name: Recover v1.2.0 release

on:
  workflow_dispatch:

concurrency:
  group: recover-v1.2.0
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-apple-silicon:
    runs-on: macos-15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.2.0
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Verify published source
        run: test "$(git rev-parse HEAD)" = 0c943645fa1a40d6bf367e12f96feb1113531f45
      - name: Install original release tooling
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.3/cargo-dist-installer.sh | sh
      - name: Build missing archive
        run: |
          dist build --tag=v1.2.0 --artifacts=local --target=aarch64-apple-darwin --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/aarch64-apple-darwin-dist-manifest.json
      - name: Attest missing archive
        uses: actions/attest@v4
        with:
          subject-path: target/distrib/trellis-gleam-aarch64-apple-darwin.tar.xz
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-recovered-apple-silicon
          path: |
            target/distrib/trellis-gleam-aarch64-apple-darwin.tar.xz
            target/distrib/trellis-gleam-aarch64-apple-darwin.tar.xz.sha256
            target/distrib/aarch64-apple-darwin-dist-manifest.json
          if-no-files-found: error

  publish:
    needs: build-apple-silicon
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      manifest: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.2.0
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Verify published source
        run: test "$(git rev-parse HEAD)" = 0c943645fa1a40d6bf367e12f96feb1113531f45
      - name: Install original release tooling
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.30.3/cargo-dist-installer.sh | sh
      - name: Fetch completed original builds
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42143479680
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Fetch recovered Apple Silicon build
        uses: actions/download-artifact@v8
        with:
          name: artifacts-recovered-apple-silicon
          path: target/distrib/
      - name: Verify archive checksums
        working-directory: target/distrib
        run: sha256sum --check trellis-gleam-*.sha256
      - name: Build installers and combined checksums
        run: |
          dist build --tag=v1.2.0 --artifacts=global --output-format=json > global-dist-manifest.json
          cp global-dist-manifest.json target/distrib/global-dist-manifest.json
      - name: Prepare release manifest
        id: host
        run: |
          dist host --tag=v1.2.0 --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c . dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Publish existing tag
        shell: bash
        run: |
          jq -er '.releases[] | select(.app_name == "trellis-gleam" and .app_version == "1.2.0") | .artifacts[] | "target/distrib/" + .' dist-manifest.json > release-assets.txt
          mapfile -t assets < release-assets.txt
          test "${#assets[@]}" -eq 16
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          jq -er '.announcement_github_body' dist-manifest.json > release-notes.md
          title="$(jq -er '.announcement_title' dist-manifest.json)"
          gh release create v1.2.0 --verify-tag --title "$title" --notes-file release-notes.md "${assets[@]}" dist-manifest.json

  publish-homebrew:
    needs: publish
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/publish-homebrew-tap.yml
    with:
      plan: ${{ needs.publish.outputs.manifest }}
    secrets: inherit
